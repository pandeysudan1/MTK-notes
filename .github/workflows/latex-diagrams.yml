name: LaTeX diagrams

on:
  push:
    branches:
      - main
      - latex-diagrams-project
    paths:
      - "latex-diagrams/**"
      - ".github/workflows/latex-diagrams.yml"
  pull_request:
    paths:
      - "latex-diagrams/**"
      - ".github/workflows/latex-diagrams.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-pictures poppler-utils

      - name: Compile PDFs and PNG previews
        run: |
          chmod +x latex-diagrams/build_and_render.sh
          latex-diagrams/build_and_render.sh

      - name: Commit generated outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/latex-diagrams-project'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latex-diagrams/generated
          if git diff --cached --quiet; then
            echo "No generated output changes."
          else
            git commit -m "Generate LaTeX diagram PDFs and PNG previews [skip ci]"
            git push
          fi
